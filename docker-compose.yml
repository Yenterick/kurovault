services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pgvector-db
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data
      - ./redis.conf:/user/local/redis/redis.conf

  volumes:
    pgdata:

